train_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /gpfs/home/int/xxx/Datasets/SCIData/SCI1K-Train/HR
      repeat: 20
      # first_k: 20
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_max: 4
      scale_min: 1
      augment: True
      sample_q: 2304 
      cell_decode: True
  batch_size: 16

val_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /gpfs/home/int/xxx/Datasets/SCIData/SCI1K-Test/X2/HR
      first_k: ~
      repeat: 1
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_max: 4
      scale_min: 1
      sample_q: 2304
      cell_decode: True
  batch_size: 16

