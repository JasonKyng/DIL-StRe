data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

model:
  name: btc-attn
  args:
    encoder_spec:
      name: rdn
      args:
        no_upsampling: True
        
    imnet_spec:
      name: mlp
      args:
        in_dim: 4
        out_dim: 3
        hidden_list: [256,256,256,256]
        act: 'relu'

    basis_ord: 3

optimizer:
  name: adam
  args:
    lr: 1.e-4
epoch_max: 1000
multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5

epoch_val: 1
epoch_save: 100
eval_bsize: 16

# resume: /gpfs/home/int/xxx/Projects/btc/save/rdn+btc-attn-e_noise01/epoch_last.pth
pre_train: /gpfs/home/int/xxx/Projects/btc/ckpt/rdn+btc-3rd.pth